name: CI

on:
  push:
    branches: [main, develop, 'copilot/**']
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: Validation
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Type check frontend
        run: npm run type-check

  # Job 2: Test Backend
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Install dependencies
        working-directory: apps/backend
        run: go mod download

      - name: Run backend tests
        working-directory: apps/backend
        run: go test -v ./...

  # Job 3: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate, test-backend]
    strategy:
      matrix:
        app: [backend, web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.app == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Go
        if: matrix.app == 'backend'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Install dependencies
        if: matrix.app == 'web'
        run: npm ci

      - name: Build backend
        if: matrix.app == 'backend'
        working-directory: apps/backend
        run: go build -o bin/server cmd/server/main.go

      - name: Build web
        if: matrix.app == 'web'
        run: npm run build --workspace=apps/web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: |
            apps/backend/bin/server
            apps/web/dist
          retention-days: 7
